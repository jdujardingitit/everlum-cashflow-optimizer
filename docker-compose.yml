version: "3.9"

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: eecf_root
      MARIADB_DATABASE: eecf_e2e
      MARIADB_USER: eecf_user
      MARIADB_PASSWORD: eecf_pass
    volumes:
      - eecf-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  wordpress:
    image: wordpress:6.5.4-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: eecf_user
      WORDPRESS_DB_PASSWORD: eecf_pass
      WORDPRESS_DB_NAME: eecf_e2e
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ALLOW_MULTISITE', false);
    volumes:
      - eecf-wp-data:/var/www/html
      - ./:/workspace:ro
      - ./scripts:/workspace/scripts:ro
    ports:
      - "8080:80"

  wpcli:
    image: wordpress:cli
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: eecf_user
      WORDPRESS_DB_PASSWORD: eecf_pass
      WORDPRESS_DB_NAME: eecf_e2e
    working_dir: /workspace
    volumes:
      - eecf-wp-data:/var/www/html
      - ./:/workspace
      - ./scripts:/workspace/scripts:ro
    entrypoint: ["sleep", "infinity"]

volumes:
  eecf-wp-data:
  eecf-mysql-data:
