name: Everlum Cashflow Optimizer - E2E QA

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e:
    name: Playwright runtime QA on WordPress sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: eecf_e2e
          MYSQL_USER: eecf_user
          MYSQL_PASSWORD: eecf_pass
          MYSQL_ROOT_PASSWORD: eecf_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -u root -peecf_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    env:
      WP_PATH: /tmp/eecf-wp
      WP_URL: http://127.0.0.1:8080
      CALC_PATH: /everlum-cf-qa
      WP_DB_NAME: eecf_e2e
      WP_DB_USER: root
      WP_DB_PASSWORD: eecf_root
      WP_DB_HOST: 127.0.0.1
      TEST_USER_EMAIL: e2e-user-a@example.test
      TEST_USER_EMAIL_ALT: e2e-user-b@example.test
      TEST_USER_PASSWORD: E2ePassA!234
      TEST_USER_PASSWORD_ALT: E2ePassB!234
      TEST_USER_NAME: Playwright QA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up PHP + WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli

      - name: Lint plugin PHP syntax
        run: php -l everlum-cashflow-optimizer.php

      - name: Bootstrap WordPress sandbox
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "${WP_PATH}"
          mkdir -p "${WP_PATH}"

          wp core download \
            --path="${WP_PATH}" \
            --version=6.5.5 \
            --force \
            --allow-root

          wp config create \
            --path="${WP_PATH}" \
            --dbname="${WP_DB_NAME}" \
            --dbuser="${WP_DB_USER}" \
            --dbpass="${WP_DB_PASSWORD}" \
            --dbhost="${WP_DB_HOST}" \
            --skip-check \
            --allow-root

          wp config set WP_ENVIRONMENT_TYPE local \
            --path="${WP_PATH}" \
            --allow-root

          wp config set DISABLE_WP_CRON true --raw \
            --path="${WP_PATH}" \
            --allow-root
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw \
            --path="${WP_PATH}" \
            --allow-root
          wp config set WP_AUTO_UPDATE_CORE false --raw \
            --path="${WP_PATH}" \
            --allow-root

          wp core install \
            --path="${WP_PATH}" \
            --url="${WP_URL}" \
            --title="Everlum Cashflow QA" \
            --admin_user=qa_admin \
            --admin_password='Q4_Admin!234' \
            --admin_email=qa_admin@localhost.localdomain \
            --skip-email \
            --allow-root

          wp option update permalink_structure '/%postname%/' --path="${WP_PATH}" --allow-root
          wp rewrite flush --hard --path="${WP_PATH}" --allow-root

          rm -rf "${WP_PATH}/wp-content/plugins/everlum-cashflow-optimizer"
          mkdir -p "${WP_PATH}/wp-content/plugins/everlum-cashflow-optimizer"
          cp everlum-cashflow-optimizer.php "${WP_PATH}/wp-content/plugins/everlum-cashflow-optimizer/"
          cp -R assets "${WP_PATH}/wp-content/plugins/everlum-cashflow-optimizer/"
          wp plugin activate everlum-cashflow-optimizer --path="${WP_PATH}" --allow-root

          wp user create "${TEST_USER_NAME// /_}" "${TEST_USER_EMAIL}" \
            --user_pass="${TEST_USER_PASSWORD}" \
            --role=subscriber \
            --path="${WP_PATH}" \
            --allow-root

          wp user create "${TEST_USER_NAME// /_}_alt" "${TEST_USER_EMAIL_ALT}" \
            --user_pass="${TEST_USER_PASSWORD_ALT}" \
            --role=subscriber \
            --path="${WP_PATH}" \
            --allow-root

          wp post create \
            --path="${WP_PATH}" \
            --post_type=page \
            --post_title='Everlum Cash Flow Optimizer QA' \
            --post_name='everlum-cf-qa' \
            --post_content='[everlum_cashflow_optimizer]' \
            --post_status=publish \
            --porcelain \
            --allow-root > /tmp/eecf_calc_page_id.txt

          echo "calc_url=${WP_URL}${CALC_PATH}/?ecf_e2e=1&disable_clarity=1" >> "$GITHUB_OUTPUT"
          echo "wp_path=${WP_PATH}" >> "$GITHUB_OUTPUT"
          echo "wp_url=${WP_URL}" >> "$GITHUB_OUTPUT"

      - name: Start WordPress server
        id: wp-server
        run: |
          set -euo pipefail

          PHP_CLI_SERVER_WORKERS=4 wp --allow-root --path="${{ steps.bootstrap.outputs.wp_path }}" server --host=127.0.0.1 --port=8080 > "${RUNNER_TEMP}/wp-server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/wp-server.pid"

          for i in {1..60}; do
            if curl -fsS "${{ steps.bootstrap.outputs.wp_url }}${CALC_PATH}/" > /dev/null 2>&1; then
              echo "WordPress ready"
              break
            fi
            sleep 2
            if [ $i -eq 60 ]; then
              echo "WordPress did not become available"
              cat "${RUNNER_TEMP}/wp-server.log"
              exit 1
            fi
          done

      - name: Install Node dependencies and Playwright
        run: |
          npm install
          npx playwright install --with-deps

      - name: Run Playwright E2E suite
        env:
          ECF_CALC_URL: ${{ steps.bootstrap.outputs.calc_url }}
          ECF_TEST_USER_EMAIL: ${{ env.TEST_USER_EMAIL }}
          ECF_TEST_USER_PASSWORD: ${{ env.TEST_USER_PASSWORD }}
          ECF_TEST_USER_EMAIL_ALT: ${{ env.TEST_USER_EMAIL_ALT }}
          ECF_TEST_USER_PASSWORD_ALT: ${{ env.TEST_USER_PASSWORD_ALT }}
          ECF_E2E_TURNSTILE_MOCK: '1'
        run: npm run test:e2e

      - name: Stop WordPress server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/wp-server.pid" ]; then
            kill "$(cat ${RUNNER_TEMP}/wp-server.pid)" || true
          fi

      - name: Upload Playwright HTML report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eecf-playwright-runtime-artifacts
          path: |
            playwright-report
            test-results
            ${{ runner.temp }}/wp-server.log
